model: {id: od_example_001, name: Version 2 OD Intersection Example}
settings: {jurisdiction: AU-WA, driving_side: left, pcu_length_m: 7.35, lane_start_displacement_s: 3, lane_end_displacement_s: 3}
lanes:
  - {id: L_W_ENTRY, arm_id: A_W, lane_type: regular, physical_length_m: 300, saturation_flow: {method: direct, value_pcu_per_hour: 1900}}
  - {id: L_CORE_1, arm_id: A_INTERNAL, lane_type: regular, physical_length_m: 80, saturation_flow: {method: rr67_unopposed, lane_width_m: 3.2}}
  - {id: L_CORE_2, arm_id: A_INTERNAL, lane_type: short, parent_lane_id: L_W_ENTRY, physical_length_m: 65, saturation_flow: {method: direct, value_pcu_per_hour: 1750}}
  - {id: L_E_EXIT, arm_id: A_E, lane_type: regular, physical_length_m: 300, saturation_flow: {method: direct, value_pcu_per_hour: 2400}}
movements:
  - {id: M_W_IN, intersection_id: I1, from_lane_id: L_W_ENTRY, to_lane_id: L_CORE_1, movement_type: through, signal_group_id: SG_A, free_flow_time_s: 5}
  - {id: M_ALT_IN, intersection_id: I1, from_lane_id: L_W_ENTRY, to_lane_id: L_CORE_2, movement_type: through, signal_group_id: SG_B, free_flow_time_s: 7}
  - {id: M_CORE_1_OUT, intersection_id: I1, from_lane_id: L_CORE_1, to_lane_id: L_E_EXIT, movement_type: through, signal_group_id: SG_A, free_flow_time_s: 5}
  - {id: M_CORE_2_OUT, intersection_id: I1, from_lane_id: L_CORE_2, to_lane_id: L_E_EXIT, movement_type: through, signal_group_id: SG_B, free_flow_time_s: 5}
  - {id: M_E_SINK, intersection_id: I1, from_lane_id: L_E_EXIT, movement_type: through, signal_group_id: SG_EXIT, free_flow_time_s: 0}
movement_conflicts: []
controller: {id: C1, cycle_time_s: 90}
phases:
  - {id: PA, active_signal_groups: [SG_A, SG_EXIT], duration_s: 40, intergreen_after_s: 5}
  - {id: PB, active_signal_groups: [SG_B, SG_EXIT], duration_s: 40, intergreen_after_s: 5}
zones:
  - {id: Z_W, name: Western boundary, zone_type: boundary, origin_movement_ids: [M_W_IN, M_ALT_IN]}
  - {id: Z_E, name: Eastern boundary, zone_type: boundary, destination_movement_ids: [M_E_SINK]}
  - {id: Z_INTERNAL, name: Internal development, zone_type: internal_source_sink, origin_movement_ids: [M_CORE_2_OUT], destination_movement_ids: [M_CORE_2_OUT]}
origin_destination_matrices:
  - id: ODM_AM
    flow_group_id: AM_BASE
    values: {Z_W: {Z_E: 900}, Z_INTERNAL: {Z_E: 60}, Z_W: {Z_E: 900, Z_INTERNAL: 40}}
flow_groups:
  - {id: AM_BASE, type: base, matrix_id: ODM_AM}
  - {id: AM_GROWTH, type: formula, expression: AM_BASE * 1.10}
  - id: AM_COMPOSITE
    type: component
    components: [{flow_group_id: AM_BASE, weight: 0.5}, {flow_group_id: AM_GROWTH, weight: 0.5}]
selected_flow_group_id: AM_COMPOSITE
routes:
  - {id: R_INTERNAL_E, origin_zone_id: Z_INTERNAL, destination_zone_id: Z_E, movement_ids: [M_CORE_2_OUT, M_E_SINK]}
  - {id: R_W_INTERNAL, origin_zone_id: Z_W, destination_zone_id: Z_INTERNAL, movement_ids: [M_ALT_IN, M_CORE_2_OUT]}
assignment: {max_iterations: 100, relative_gap_tolerance: 0.01, max_flow_change_tolerance_pcu_per_hour: 1.0, theta_per_second: 0.08, max_routes_per_od: 8, max_movements_per_route: 12}
simulation: {warm_up_cycles: 5, reporting_cycles: 20}
