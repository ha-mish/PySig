# Signal Settings ------------------------------------------------------- 
controllers:
  - {id: C1, intersection_id: I1, cycle_time_s: 60, offset_s: 0,
    optimisation: {
      enabled: true,
      cycle_times_s: [60, 50, 70],
      split_step_s: 5,
      offset_step_s: 0,
      minimum_green_s: 10}}

phases:
  - {id: P_A, controller_id: C1, active_signal_groups: [SG_A11], duration_s: 55, intergreen_after_s: 5}
