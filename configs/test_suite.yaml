# Cycle optimisation and assignment settings --------
assignment:
  max_iterations: 30
  max_flow_change_tolerance: 1.0
  conservation_tolerance: 0.000001
  theta: 0.08


network:
  horizon_s: 900
  time_slice_s: 5
  warm_up_s: 120


optimisation:

  method: sequential
  objective: network_delay

  outer_iterations: 3
  outer_flow_tolerance: 1.0

  max_candidates_per_controller: 100

  max_lane_storage_utilisation: 0.95
  max_link_storage_utilisation: 0.95

  common_cycle: false

  unconverged_candidate_policy: reject
