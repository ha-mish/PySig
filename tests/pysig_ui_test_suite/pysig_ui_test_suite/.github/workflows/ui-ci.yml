name: PySig Studio UI CI

on:
  push:
    branches:
      - ui-development
      - "ui/**"
      - "feature/ui/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run non-UI tests
        run: python -m pytest -m "not ui" -v --tb=short

  studio-browser-tests:
    name: Studio browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python and Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest playwright pytest-playwright

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run Studio feature tests
        run: |
          python -m pytest tests/ui -m ui -v --tb=short \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --output test-results

      - name: Upload Playwright failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pysig-studio-playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
