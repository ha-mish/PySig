model:
  id: UI_TEST
  name: PySig Studio UI Feature Test

calculation:
  method: simulation

settings:
  jurisdiction: AU-WA
  driving_side: left
  pcu_length_m: 7.35
  lane_start_displacement_s: 3.0
  lane_end_displacement_s: 3.0

intersections:
  - id: I1
    name: Canning Highway / Test Road
    controller_id: C1
    arms:
      - id: A1
        name: Canning Highway
        direction: E/B
        relation: Entry
        bearing_degrees: 0
        visual_length: 270
        carriageway_offset_m: 18
      - id: A2
        name: Test Road
        direction: S/B
        relation: Entry
        bearing_degrees: 90
        visual_length: 245
        carriageway_offset_m: 18
      - id: A3
        name: Canning Highway
        direction: W/B
        relation: Exit
        bearing_degrees: 180
        visual_length: 270
        carriageway_offset_m: 18
      - id: A4
        name: Test Road
        direction: N/B
        relation: Exit
        bearing_degrees: 270
        visual_length: 245
        carriageway_offset_m: 18
    movement_ids:
      - T_WE
      - R_WS
      - T_SN

lanes:
  - id: A1_1
    intersection_id: I1
    arm_id: A1
    physical_length_m: 220
    saturation_flow:
      method: direct
      value_pcu_per_hour: 1900
  - id: A1_2
    intersection_id: I1
    arm_id: A1
    physical_length_m: 120
    saturation_flow:
      method: direct
      value_pcu_per_hour: 1800
  - id: A2_1
    intersection_id: I1
    arm_id: A2
    physical_length_m: 160
    saturation_flow:
      method: direct
      value_pcu_per_hour: 1850
  - id: A3_1
    intersection_id: I1
    arm_id: A3
    physical_length_m: 120
    saturation_flow:
      method: direct
      value_pcu_per_hour: 1900
  - id: A4_1
    intersection_id: I1
    arm_id: A4
    physical_length_m: 120
    saturation_flow:
      method: direct
      value_pcu_per_hour: 1900

movements:
  - id: T_WE
    intersection_id: I1
    from_lane_id: A1_1
    to_lane_id: A3_1
    movement_type: through
    signal_group_id: SG_EW
    free_flow_time_s: 8
  - id: R_WS
    intersection_id: I1
    from_lane_id: A1_2
    to_lane_id: A4_1
    movement_type: right
    signal_group_id: SG_ARROW
    free_flow_time_s: 8
  - id: T_SN
    intersection_id: I1
    from_lane_id: A2_1
    to_lane_id: A4_1
    movement_type: through
    signal_group_id: SG_NS
    free_flow_time_s: 8

controllers:
  - id: C1
    intersection_id: I1
    cycle_time_s: 70
    offset_s: 0
    optimisation:
      enabled: true
      cycle_times_s: [60, 70, 80]
      split_step_s: 5
      offset_step_s: 0
      minimum_green_s: 10

phases:
  - id: P_A
    controller_id: C1
    active_signal_groups: [SG_EW]
    duration_s: 30
    intergreen_after_s: 5
  - id: P_B
    controller_id: C1
    active_signal_groups: [SG_NS, SG_ARROW]
    duration_s: 30
    intergreen_after_s: 5

movement_conflicts: []
network_links: []
routes:
  - id: R_W_E
    origin_zone_id: Z_W
    destination_zone_id: Z_E
    movement_ids: [T_WE]
  - id: R_W_S
    origin_zone_id: Z_W
    destination_zone_id: Z_S
    movement_ids: [R_WS]
  - id: R_S_N
    origin_zone_id: Z_S
    destination_zone_id: Z_N
    movement_ids: [T_SN]
origin_destination_matrix:
  values:
    Z_W:
      Z_E: 500
      Z_S: 120
    Z_S:
      Z_N: 300
assignment:
  max_iterations: 10
  max_flow_change_tolerance: 1.0
  conservation_tolerance: 0.000001
  theta: 0.08
network:
  horizon_s: 300
  time_slice_s: 5
  warm_up_s: 0
optimisation:
  method: sequential
  objective: network_delay
  outer_iterations: 1
  outer_flow_tolerance: 1.0
  max_candidates_per_controller: 10
  max_lane_storage_utilisation: 0.95
  max_link_storage_utilisation: 0.95
  common_cycle: false
  unconverged_candidate_policy: reject
