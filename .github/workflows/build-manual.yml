name: Build PySig user manual

on:
  push:
    branches: [main]
    paths:
      - "docs/manual/**"
      - ".github/workflows/build-manual.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/manual/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX manual
        uses: xu-cheng/latex-action@v4
        with:
          root_file: pysig_manual.tex
          working_directory: docs/manual
          compiler: latexmk
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload compiled manual
        uses: actions/upload-artifact@v4
        with:
          name: PySig-0.4.3-User-Manual
          path: docs/manual/pysig_manual.pdf
          if-no-files-found: error
          retention-days: 30
