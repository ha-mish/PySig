name: PySig CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ============================================================
  # BLACK
  # ============================================================

  black:
    name: Black formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==23.10.1

      - name: Check formatting
        run: |
          python -m black --check --diff .


  # ============================================================
  # FLAKE8
  # ============================================================

  flake8:
    name: Flake8 linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8

      - name: Run Flake8
        run: |
          python -m flake8 .


  # ============================================================
  # PYTEST
  # ============================================================

  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest

      - name: Run test suite
        run: |
          python -m pytest -v -ra --tb=short


  # ============================================================
  # DOCUMENTATION
  #
  # This job only runs once Black, Flake8 and pytest pass.
  # ============================================================

  documentation:
    name: Build user manual

    needs:
      - black
      - flake8
      - pytest

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile PySig manual
        uses: xu-cheng/latex-action@v4
        with:
          root_file: pysig_manual.tex
          working_directory: docs/manual
          work_in_root_file_dir: true
          compiler: latexmk
          args: >-
            -pdf
            -file-line-error
            -halt-on-error
            -interaction=nonstopmode

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: PySig-0.4.3-User-Manual
          path: docs/manual/pysig_manual.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload LaTeX diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PySig-0.4.3-LaTeX-build-log
          path: |
            docs/manual/pysig_manual.log
            docs/manual/pysig_manual.fls
            docs/manual/pysig_manual.aux
          if-no-files-found: warn
          retention-days: 14
